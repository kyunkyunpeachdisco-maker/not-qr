<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ふっかつのメロディ - QRじゃないQR</title>
<meta name="description" content="URLや短い文章をファミコン風の曲に変えて演奏し、マイクで聞きとって元に戻すツール。">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="ふっかつのメロディ - QRじゃないQR">
<meta property="og:description" content="URLや短い文章をファミコン風の曲に変えて演奏し、マイクで聞きとって元に戻すツール。">
<meta property="og:url" content="https://kyunkyunpeachdisco-maker.github.io/not-qr/melody.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kyunkyunpeachdisco-maker.github.io/not-qr/icons/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kyunkyunpeachdisco-maker.github.io/not-qr/icons/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'MS Gothic', monospace;
    background: #000; color: #f4f4f8; font-size: 16px; touch-action: manipulation;
  }
  #app { position: relative; height: 100dvh; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; background: #05060d; }
  .win { background: #0a0b1c; border: 3px solid #f4f4f8; border-radius: 6px; box-shadow: 0 0 0 2px #000, inset 0 0 0 1px #000; }
  .back { align-self: flex-start; padding: 10px 12px 0; color: #b6b6d8; font-size: 14px; text-decoration: none; }
  h1 { text-align: center; color: #ffd23b; font-size: 24px; letter-spacing: 6px; padding: 2px 8px 6px; text-shadow: 2px 2px 0 #000; font-weight: normal; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px; }
  .pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 8px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .pane > * { flex-shrink: 0; }
  .hidden { display: none !important; }
  .label { color: #ffd23b; font-size: 15px; letter-spacing: 1px; }
  .info { color: #b6b6d8; font-size: 13px; line-height: 1.7; }
  .msg { color: #ff8a8a; min-height: 1.6em; }
  textarea { font-family: inherit; font-size: 18px; line-height: 1.6; width: 100%; resize: vertical; padding: 10px;
    background: #0a0b1c; color: #f4f4f8; border: 2px solid #f4f4f8; border-radius: 5px; }
  .score { background: #f4efdc; color: #1a1a2a; border-radius: 4px; padding: 6px; }
  .score .playing, .score .playing * { color: #e0382a; fill: #e0382a; }
  .listen { text-align: center; padding: 18px 12px; }
  .listen .note { font-size: 40px; color: #ffd23b; min-height: 1.4em; }
  .listen .state { margin-top: 6px; letter-spacing: 1px; }
  .bar { height: 10px; background: #000; border: 1px solid #555; border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: #4cd24c; transition: width 0.2s; }
  .result { padding: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-all; user-select: text; -webkit-user-select: text; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button, a.btn, label.btn { position: relative; display: block; font-family: inherit; font-size: 16px; padding: 13px 12px 13px 26px; border: 2px solid #f4f4f8; border-radius: 5px;
    background: #0a0b1c; color: #f4f4f8; cursor: pointer; min-height: 50px; text-align: left; letter-spacing: 0.5px; text-decoration: none; }
  button::before, a.btn::before, label.btn::before { content: '▶'; position: absolute; left: 9px; opacity: 0; color: #ffd23b; }
  button:active, a.btn:active, label.btn:active { background: #f4f4f8; color: #0a0b1c; }
  button:active::before, a.btn:active::before, label.btn:active::before { opacity: 1; color: #0a0b1c; }
  button.primary, a.btn.primary { border-color: #ffd23b; color: #ffd23b; } .wide { grid-column: 1 / -1; }
  .tabs button { text-align: center; padding-left: 12px; } .tabs button::before { display: none; }
  .tabs button.on { border-color: #ffd23b; color: #ffd23b; }
  .tabs button.on::after { content: '▼'; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); font-size: 10px; color: #ffd23b; }
  .readlink { align-self: flex-end; margin: 0 12px 6px; color: #ffd23b; font-size: 14px; text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <a class="back" href="./">◀ もどる</a>
  <h1>ふっかつのメロディ</h1>
  <a class="readlink" href="fukkatsu.html">よみとるときは ▶ ふっかつ</a>

  <div class="pane" id="pane-make">
    <div class="label">つたえたい ことば・URL</div>
    <textarea id="make-in" rows="3" spellcheck="false" placeholder="例: https://example.com/"></textarea>
    <button class="primary" onclick="doMake()">きょくに する（Ctrl+Enter）</button>
    <div class="msg" id="make-msg"></div>
    <div id="make-result" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <div class="info" id="make-info"></div>
      <div class="actions">
        <button class="primary" id="play-btn" onclick="togglePlay()">えんそう</button>
        <button onclick="saveWav()">おとを ほぞん</button>
        <button class="wide" id="video-btn" onclick="saveVideo()">えんそうを どうがで ほぞん</button>
      </div>
      <div class="win score" id="score"></div>
      <div class="info">はじめの1小節は前奏、つづく「ソラソラ」が合図です。合図のあとの音に、ことばが入っています。</div>
    </div>
  </div>

</div>

<script src="js/common.js?v=1.12.8"></script>
<script src="js/melody-core.js?v=1.12.8"></script>

<script>
// ===== つくる =====
let song = null, playCtx = null, playTimer = null;
async function doMake() {
  const text = $('make-in').value;
  $('make-msg').textContent = '';
  if (!text.trim()) { $('make-msg').textContent = 'ことばを いれてください'; return; }
  stopPlay();
  try { song = await songFromText(text); }
  catch (e) { $('make-msg').textContent = 'ながすぎて きょくに できません'; return; }
  const sec = Math.round(song.melody.length * T);
  $('make-info').textContent = `${songBars(song)}小節・やく${sec}びょう`;
  $('make-result').classList.remove('hidden');
  if (window.ABCJS) ABCJS.renderAbc('score', songToAbc(song), { responsive: 'resize', add_classes: true, paddingtop: 0, paddingbottom: 0 });
  else $('score').textContent = 'がくふを ひょうじできませんでした（ネットにつながっているか たしかめてください）';
}
function stopPlay() {
  if (playCtx) { playCtx.close(); playCtx = null; }
  clearInterval(playTimer);
  document.querySelectorAll('#score .playing').forEach((el) => el.classList.remove('playing'));
  $('play-btn').textContent = 'えんそう';
}
async function togglePlay() {
  if (playCtx) return stopPlay();
  // AudioContext はボタンを押した直後に作る(iPhoneで音が出なくなるのを防ぐ)
  const ctx = playCtx = new AudioContext();
  $('play-btn').textContent = 'じゅんびちゅう…';
  // その場で何千もの音を予約すると長い曲で音がとぎれるので、先に曲全体を音声にしてから流す
  const buf = await renderSong(song, ctx.sampleRate);
  if (playCtx !== ctx) return;
  const srcNode = ctx.createBufferSource(); srcNode.buffer = buf; srcNode.connect(ctx.destination);
  const start = ctx.currentTime + 0.05 + 0.1, dur = buf.duration - 0.1;
  srcNode.start(start - 0.1);
  $('play-btn').textContent = 'とめる';
  // 楽譜の いま鳴っている音を赤くする
  const slotEl = slotElements();
  let lastEl = null;
  playTimer = setInterval(() => {
    const t = ctx.currentTime - start;
    if (t > dur) return stopPlay();
    const el = slotEl[Math.floor(t / T)];
    if (el !== lastEl) { if (lastEl) lastEl.classList.remove('playing'); if (el) el.classList.add('playing'); lastEl = el; }
  }, 30);
}
// 1音(8分音符)ごとに、楽譜の どの音符(休符)に あたるか
function slotElements() {
  const els = [...document.querySelectorAll('#score .abcjs-note, #score .abcjs-rest')], slotEl = [];
  for (let b = 0, e = 0; b < songBars(song); b++) {
    const notes = song.melody.slice(b * 8, b * 8 + 8);
    if (b === songBars(song) - 1 || notes.every((m) => m === null)) { for (let s = 0; s < 8; s++) slotEl.push(els[e]); e++; }
    else for (let s = 0; s < 8; s++) slotEl.push(els[e++]);
  }
  return slotEl;
}
// 演奏を 動画にする: 楽譜を絵にして、いま鳴っている音に 赤い印をつけながら 音といっしょに録画する
async function saveVideo() {
  const svg = document.querySelector('#score svg');
  if (!svg) return;
  const btn = $('video-btn'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'じゅんびちゅう…';
  const ac = new AudioContext();
  try {
    // 楽譜(SVG)を 画像にする
    const vb = svg.viewBox.baseVal, clone = svg.cloneNode(true);
    clone.setAttribute('width', vb.width); clone.setAttribute('height', vb.height); clone.style.color = '#1a1a2a';
    clone.querySelectorAll('.playing').forEach((e) => e.classList.remove('playing'));
    const scoreImg = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone)));
    const boxes = slotElements().map((e) => (e ? e.getBBox() : null));
    // 画面: 4:5。楽譜が入りきらないときは 鳴っている行に あわせて 上下に動かす
    const W = 1080, H = 1350, pad = 40, sc = (W - pad * 2 - 40) / vb.width, maxH = H - 150 - 140;
    // 楽譜が短いときは 紙の部分を 楽譜の高さにして 上下まんなかに置く
    const viewH = Math.min(maxH, vb.height * sc + 40), top = 150 + (maxH - viewH) / 2;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const buf = await renderSong(song, 48000), dur = buf.duration;
    let scroll = 0;
    // 曲の t 秒の 画面を描く
    const drawAt = (t) => {
      const slot = Math.floor((t - 0.1) / T), box = boxes[slot];
      x.fillStyle = '#05060d'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#ffd23b'; x.font = '56px "DotGothic16", monospace'; x.textAlign = 'center'; x.fillText('ふっかつのメロディ', W / 2, top - 50);
      x.fillStyle = '#f4efdc'; x.fillRect(pad, top, W - pad * 2, viewH);
      if (box) { const want = box.y * sc - viewH * 0.35; scroll += (Math.max(0, Math.min(vb.height * sc - viewH + 40, want)) - scroll) * 0.15; }
      x.save(); x.beginPath(); x.rect(pad, top, W - pad * 2, viewH); x.clip();
      x.translate(pad + 20, top + 20 - scroll); x.scale(sc, sc);
      x.drawImage(scoreImg, 0, 0, vb.width, vb.height);
      if (box && t >= 0.1 && t < dur) { x.fillStyle = 'rgba(224,56,42,0.35)'; x.fillRect(box.x - 3, box.y - 3, box.width + 6, box.height + 6); }
      x.restore();
      x.fillStyle = '#23243a'; x.fillRect(pad, H - 90, W - pad * 2, 14);
      x.fillStyle = '#4cd24c'; x.fillRect(pad, H - 90, (W - pad * 2) * Math.max(0, Math.min(1, t / dur)), 14);
      x.fillStyle = '#b6b6d8'; x.font = '30px "DotGothic16", monospace'; x.fillText('ききとると ことばが ふっかつします', W / 2, H - 30);
    };
    // まず 1コマずつ 書きだす。使えないブラウザなら 録画で作る
    let blob = null;
    encodeVideoFile.note = '';
    try {
      blob = await encodeVideoFile({ canvas: c, duration: dur, draw: drawAt, audio: { sampleRate: buf.sampleRate, channels: [buf.getChannelData(0)] }, bitrate: 6000000,
        onStage: (st) => { btn.textContent = `${st}…`; },
        onProgress: (p) => { btn.textContent = `どうがを つくっています… ${Math.round(p * 100)}%`; } });
    } catch (e) { blob = null; $('make-msg').textContent = `うまく 書きだせなかったので、録画で 作りなおします（${e && e.message}）`; }
    if (blob) { $('make-msg').textContent = `✓ どうがが できました（${encodeVideoFile.note}）`; saveBlobLater(blob, stampName('fukkatsu-melody', 'mp4'), encodeVideoFile.note); return; }
    if (encodeVideoFile.note) $('make-msg').textContent = `録画で 作ります（${encodeVideoFile.note}）`;
    scroll = 0;
    const stream = c.captureStream(30), src = ac.createBufferSource(), dest = ac.createMediaStreamDestination();
    src.buffer = buf; src.connect(dest);
    dest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));
    const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime) throw new Error('no recorder');
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 }), chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise((ok) => { rec.onstop = ok; });
    let raf = 0;
    const startAt = ac.currentTime + 0.2;
    const loop = () => {
      const t = ac.currentTime - startAt;
      drawAt(t);
      btn.textContent = `どうがを つくっています… ${Math.max(0, Math.min(100, Math.round((t / dur) * 100)))}%`;
      raf = requestAnimationFrame(loop);
    };
    loop();
    rec.start();
    src.start(startAt);
    await new Promise((ok) => { src.onended = ok; });
    await new Promise((ok) => setTimeout(ok, 300));
    rec.stop(); cancelAnimationFrame(raf);
    await stopped;
    saveBlobLater(new Blob(chunks, { type: mime.split(';')[0] }), stampName('fukkatsu-melody', mime.includes('mp4') ? 'mp4' : 'webm'), `録画で 作りました ${mime}（${encodeVideoFile.note || $('make-msg').textContent}）`);
  } catch (e) {
    $('make-msg').textContent = 'このブラウザでは どうがを 作れませんでした';
  } finally {
    ac.close(); btn.disabled = false; btn.textContent = label;
  }
}
function wavBlob(buf) {
  const d = buf.getChannelData(0), sr = buf.sampleRate, ab = new ArrayBuffer(44 + d.length * 2), v = new DataView(ab);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + d.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
  return new Blob([ab], { type: 'audio/wav' });
}
async function saveWav() {
  saveBlob(wavBlob(await renderSong(song)), stampName('fukkatsu-melody', 'wav'));
}

$('make-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doMake(); } });
</script>
</body>
</html>
